<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1200, initial-scale=1">
  <title>Alify Lopes</title>
  <style>
    @font-face{font-family:Bricolage;src:url('./fonts/bricolage-grotesque-latin-wght-normal.woff2') format('woff2');font-weight:100 900;font-display:block}
    :root{--background:#0f0f11;--accent:#ff5b3a;--ink:#f0eee8;--width:1200px;--height:630px;--inset:70px;--title-size:156px;--subtitle-size:30px;--art-width:300px;--art-height:236px}
    *{box-sizing:border-box}html,body{margin:0;width:var(--width);height:var(--height);overflow:hidden;background:var(--background);color:var(--ink);font-family:Bricolage,sans-serif}
    main{position:relative;width:100%;height:100%;padding:var(--inset);display:flex;align-items:center}
    h1{margin:0;font-size:var(--title-size);font-weight:700;line-height:.86;letter-spacing:-.065em}
    h1 span{display:block}h1 .surname{color:transparent;-webkit-text-stroke:1.5px var(--ink)}
    p{margin:36px 0 0;font-size:var(--subtitle-size);font-weight:400;letter-spacing:-.025em}
    svg{position:absolute;right:var(--inset);top:180px;width:var(--art-width);height:var(--art-height);fill:none;stroke:var(--accent);stroke-width:2}
  </style>
</head>
<body>
  <main>
    <div><h1><span>Alify</span><span class="surname">Lopes</span></h1><p>Engenheiro de IA e software</p></div>
    <svg viewBox="0 0 280 220" aria-label="Monograma AL" role="img"><path d="M20 190 L80 20 L140 190 M42 136 H118"/><path d="M182 20 V190 H256"/></svg>
  </main>
</body>
</html>
